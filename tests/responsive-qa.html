<!doctype html><html lang="en"><meta charset="utf-8"><title>Desk Overflow responsive QA</title><style>body{font:16px system-ui;margin:16px;background:#eee;color:#111}iframe{border:1px solid #777;display:block}pre{white-space:pre-wrap}.off{position:absolute;left:-10000px;top:0}</style><h1>Preserved landing page responsive checks</h1><p>Local test harness only. No form submission or external record creation.</p><label>Preview width <select id="size"><option>320</option><option>375</option><option>768</option><option>1265</option><option>1440</option></select></label><pre id="report">Loading layouts</pre><iframe id="preview" title="Preserved landing page mobile preview" width="320" height="1400" src="../index.html"></iframe><script>
const widths=[320,375,768,1265,1440],results=[];
for(const width of widths){const f=document.createElement('iframe');f.className='off';f.setAttribute('aria-hidden','true');f.width=width;f.height=1000;f.src='../index.html';f.onload=()=>{const d=f.contentDocument,w=f.contentWindow,hero=d.querySelector('.hero-text'),visual=d.querySelector('.hero-visual'),h=hero.getBoundingClientRect(),v=visual.getBoundingClientRect();results.push({width,viewport:d.documentElement.clientWidth,pageWidth:d.documentElement.scrollWidth,horizontalOverflow:d.documentElement.scrollWidth>d.documentElement.clientWidth,heroTextBottom:Math.round(h.bottom),visualTop:Math.round(v.top),mobileHeroOverlap:width<=800&&h.bottom>v.top,formColumns:w.getComputedStyle(d.querySelector('.form-grid')).gridTemplateColumns});document.getElementById('report').textContent=results.sort((a,b)=>a.width-b.width).map(r=>r.width+'px: overflow='+r.horizontalOverflow+', hero overlap='+r.mobileHeroOverlap+', text bottom='+r.heroTextBottom+', visual top='+r.visualTop).join('\n');};document.body.append(f);}
document.getElementById('size').onchange=e=>{const f=document.getElementById('preview');f.width=e.target.value;f.style.zoom=Math.min(1,1100/Number(e.target.value));};
</script></html>
