<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Desk Overflow responsive QA</title><style>body{font:16px system-ui;margin:16px;background:#edf2f5;color:#11283d}iframe{border:1px solid #8095a5;display:block;background:white}pre{white-space:pre-wrap}.off{position:absolute;left:-10000px;top:0}select{font:inherit;padding:8px}</style><h1>Landing page responsive checks</h1><p>Read-only layout checks. No inquiry submission.</p><label>Preview width <select id="size"><option>320</option><option selected>375</option><option>768</option><option>1265</option><option>1440</option></select></label><pre id="report" aria-live="polite">Loading layouts…</pre><iframe id="preview" title="Landing page mobile preview" width="375" height="1400" src="../index.html"></iframe><script>
const widths=[320,375,768,1265,1440],results=[];
for(const width of widths){const f=document.createElement('iframe');f.className='off';f.setAttribute('aria-hidden','true');f.width=width;f.height=1000;f.src='../index.html';f.onload=async()=>{try{const d=f.contentDocument,w=f.contentWindow;await d.fonts.ready;const h=d.querySelector('.hero-copy').getBoundingClientRect(),v=d.querySelector('.hero-scene').getBoundingClientRect();results.push({width,overflow:d.documentElement.scrollWidth>d.documentElement.clientWidth,overlap:width<=900&&h.bottom>v.top,menu:w.getComputedStyle(d.querySelector('#menu')).display!=='none'});document.getElementById('report').textContent=results.sort((a,b)=>a.width-b.width).map(r=>r.width+'px: overflow='+r.overflow+', hero overlap='+r.overlap+', mobile menu='+r.menu).join('\n')}catch(e){document.getElementById('report').textContent='Layout check failed: '+e.message}};document.body.append(f)}
document.getElementById('size').onchange=e=>{document.getElementById('preview').width=e.target.value};
</script></html>
